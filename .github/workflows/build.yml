name: Windows offline checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compile with in-box Framework compiler
        shell: powershell
        run: ./tools/build-capture-tool.ps1
      - name: Run all basic offline checks including STA windows
        shell: powershell
        run: ./tools/test-capture-tool.ps1
      - name: Verify privacy scanner fail-closed behavior
        shell: powershell
        run: ./tools/test-release-scan.ps1
      - name: Run full synthetic stream and audio checks with pinned FFmpeg
        shell: powershell
        run: |
          ./tools/prepare-release-ci.ps1 -Download
          ./tools/test-capture-tool.ps1 -Stream
          'stream=executed; hardware=not-run; hosted-runner=actual-job-result' | Set-Content evidence/ci-boundary.txt
      - name: Scan current public source and all fetched history
        shell: powershell
        run: |
          & ./tools/release-scan.ps1 -Scope WorkingTree -ReportPath evidence/release-worktree.json
          $worktreeCode = $LASTEXITCODE
          & ./tools/release-scan.ps1 -Scope History -ReportPath evidence/release-history.json
          if ($worktreeCode -ne 0 -or $LASTEXITCODE -ne 0) { throw 'Privacy review is unresolved; source is not ready to publish.' }
      - name: Retain only sanitized scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-review-locations
          path: |
            evidence/release-worktree.json
            evidence/release-history.json
            evidence/ci-boundary.txt
          if-no-files-found: warn
          retention-days: 7
